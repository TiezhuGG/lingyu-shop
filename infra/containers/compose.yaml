name: lingyu-shop-dev
services:
  postgres:
    # Development series tags; resolve exact patch/digest after engine recovery.
    image: postgres:17
    environment:
      POSTGRES_DB: lingyu_shop_poc
      POSTGRES_USER: lingyu_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local development password}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingyu_dev -d lingyu_shop_poc"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.2
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  redis-data:
